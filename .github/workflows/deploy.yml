name: Deploy Wedding develop

on:
  push:
    branches:
      - develop  # develop 브랜치에 푸시될 때 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 리포지토리 클론
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Node.js 설정
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18.19.0  # 사용할 Node.js 버전

      # 3. 의존성 설치
      - name: Install dependencies
        run: npm install

      # 4. 빌드 실행
      - name: Build project
        env:
          NEXT_PUBLIC_KAKAO_MAP_API_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_MAP_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_KEY }}
          NEXT_PUBLIC_BRIDE_NAME: ${{ secrets.NEXT_PUBLIC_BRIDE_NAME }}
          NEXT_PUBLIC_BRIDE_MOM_NAME: ${{ secrets.NEXT_PUBLIC_BRIDE_MOM_NAME }}
          NEXT_PUBLIC_BRIDE_FATHER_NAME: ${{ secrets.NEXT_PUBLIC_BRIDE_FATHER_NAME }}
          NEXT_PUBLIC_GROOM_NAME: ${{ secrets.NEXT_PUBLIC_GROOM_NAME }}
          NEXT_PUBLIC_GROOM_MOM_NAME: ${{ secrets.NEXT_PUBLIC_GROOM_MOM_NAME }}
          NEXT_PUBLIC_GROOM_FATHER_NAME: ${{ secrets.NEXT_PUBLIC_GROOM_FATHER_NAME }}


        run: npm run build

      # 5. GitHub Pages에 배포
      - name: Deploy to Wedding Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out  # Next.js 빌드 결과물 디렉토리
